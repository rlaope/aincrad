[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aincrad-sim"
version = "0.1.0"
description = "결정론적 규칙 위에서 자율 AI 모험가를 관찰하는 터미널 샌드박스"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "rlaope" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyte>=0.8",
  "ruff>=0.6",
]

[project.scripts]
aincrad = "aincrad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aincrad"]
warn_unused_ignores = true
